aic:
  def: Míra kvality modelu, která penalizuje složitost - čím nižší AIC, tím lepší
    poměr mezi přesností modelu a počtem jeho parametrů.
anova:
  def: Statistický test porovnávající průměry tří a více skupin zároveň; testuje,
    zda se alespoň jedna skupina průměrem liší od ostatních.
binarni-promenna:
  def: Proměnná nabývající právě dvou hodnot, nejčastěji 0/1, přítomnost/nepřítomnost,
    ano/ne.
boxplot:
  def: 'Graf zobrazující pět souhrnných statistik najednou: minimum, Q1, medián, Q3
    a maximum; krabice ohraničuje interkvartilový rozsah (IQR).'
diagnostika-modelu:
  def: 'Soubor grafických a numerických kontrol ověřujících, zda jsou splněny předpoklady
    modelu: linearita, normalita reziduí, homoskedasticita, absence vlivných bodů.'
efekt:
  def: Kvantitativní popis toho, jak silně prediktor ovlivňuje odezvu - zahrnuje směr,
    velikost a nejistotu (interval spolehlivosti).
f-statistika:
  def: Testová statistika porovnávající rozptyl vysvětlený modelem s rozptylem nevysvětleným
    (reziduálním); vyšší F = vyšší poměr signal:šum.
glm:
  def: Rozšíření lineárního modelu pro případy, kdy odezva není normálně rozložena;
    skládá se z náhodné složky, systematické složky a link funkce.
heteroskedasticita:
  def: Jev, kdy rozptyl reziduí není konstantní podél hodnot prediktoru - typicky
    se rozptyl zvyšuje s rostoucí predikovanou hodnotou.
hierarchicka-data:
  def: Data, kde pozorování nejsou zcela nezávislá - jsou seskupena do vyšší úrovně
    (lokality, bloky, jedinci s opakovanými měřeními).
histogram:
  def: 'Graf zobrazující rozdělení hodnot numerické proměnné: hodnoty jsou seřazeny
    do tříd, výška sloupce udává četnost v dané třídě.'
hladina-vyznamnosti:
  def: Předem zvolená pravděpodobnostní hranice (typicky α = 0,05), pod níž prohlásíme
    výsledek za statisticky významný.
iqr:
  def: Rozdíl mezi 3. kvartilem (Q3) a 1. kvartilem (Q1); pokrývá prostředních 50
    % dat a je robustní vůči odlehlým pozorováním.
intercept:
  def: 'Parametr modelu: hodnota odezvy predikovaná modelem, když jsou všechny prediktory
    rovno nule; geometricky jde o úsek na ose y (kde regresní přímka protíná osu y).'
interval-spolehlivosti:
  def: Rozsah hodnot, v němž se s danou spolehlivostí (typicky 95 %) nachází odhadovaný
    parametr.
interakce-predikatoru:
  def: Situace, kdy efekt jednoho prediktoru na odezvu závisí na hodnotě jiného prediktoru.
kategoricka-promenna:
  def: Proměnná nabývající hodnot z omezeného počtu kategorií; může být nominální
    (bez pořadí) nebo ordinální (s pořadím).
r2:
  def: Podíl variability odezvy vysvětlený modelem (0 = model nevysvětluje nic, 1
    = model vysvětluje vše).
konfundovani:
  def: Jev, kdy zdánlivý efekt jednoho prediktoru je (zcela nebo zčásti) způsoben
    třetí proměnnou korelující s oběma.
kovariance:
  def: Míra toho, nakolik se dvě numerické proměnné odchylují od svých průměrů společně;
    kladná kovariance značí, že mají tendenci růst spolu, záporná že se pohybují opačně.
korelace-predikatoru:
  def: Situace, kdy dva nebo více prediktorů v modelu navzájem korelují; silná korelace
    způsobuje nestabilitu odhadů.
kvantil:
  def: Hodnota, pod níž leží určený podíl seřazených dat; medián je 50% kvantil.
linearni-model:
  def: Statistický model předpokládající, že odezva je lineární funkcí prediktorů
    plus chybový člen s normálním rozdělením (y = a + b·x + ε).
link-funkce:
  def: Matematická funkce v GLM propojující lineární prediktor s očekávanou hodnotou
    odezvy; zajišťuje, že predikované hodnoty jsou v platném rozsahu.
logisticka-regrese:
  def: GLM pro binární odezvu (0/1, přítomnost/nepřítomnost); modeluje pravděpodobnost
    výskytu pomocí logit link funkce.
median:
  def: Hodnota rozdělující seřazená data na dvě stejně početné poloviny; 50. percentil.
min-adekvat-model:
  def: Nejjednodušší model, který adekvátně vysvětluje data - odstraňuje nepotřebné
    parametry bez výrazného zhoršení shody s daty (princip parsimonie).
nahodny-faktor:
  def: Faktor v smíšeném modelu, jehož úrovně jsou náhodným vzorkem z většího souboru;
    zajímá nás rozptyl, který přináší, ne konkrétní úrovně.
nejistota:
  def: Rozsah, v němž nevíme přesnou hodnotu parametru kvůli omezenému a variabilnímu
    vzorku; kvantifikuje se pomocí intervalů spolehlivosti nebo směrodatných chyb.
nelinearita:
  def: Situace, kdy vztah mezi prediktorem a odezvou není dobře popsatelný přímkou
    - má zakřivení nebo jinou nelineární formu.
neparametricky-test:
  def: Test, který nespočívá na předpokladu konkrétního rozdělení dat; pracuje s pořadími
    místo s původními hodnotami.
nulova-hypoteza:
  def: Výchozí předpoklad, který testujeme - typicky 'efekt je nulový' nebo 'skupiny
    se neliší'; p-hodnota udává pravděpodobnost dat za předpokladu platnosti H₀.
numericka-promenna:
  def: Proměnná nabývající libovolných číselných hodnot na spojité nebo diskrétní
    číselné stupnici (délky, hmotnosti, teploty, počty).
odezva:
  def: Proměnná, jejíž variabilitu se snažíme vysvětlit nebo předpovědět; v notaci
    modelu `y ~ x` je odezva `y`.
odlehla-pozorovani:
  def: Hodnota, která se výrazně odlišuje od ostatních pozorování; může být způsobena
    chybou měření nebo jít o skutečně extrémní případ.
opakovana-mereni:
  def: Data, kde stejná jednotka (jedinec, lokalita) je měřena opakovaně v čase nebo
    v různých podmínkách; vytváří korelaci mezi pozorováními.
p-hodnota:
  def: Pravděpodobnost, že bychom při platnosti nulové hypotézy pozorovali data alespoň
    tak extrémní jako naše skutečná data.
parametry-modelu:
  def: Číselné hodnoty odhadnuté z dat definující tvar modelu; v lineárním modelu
    jsou to intercept a sklon(y).
pevny-faktor:
  def: Faktor v modelu, jehož konkrétní úrovně jsou pro analýzu relevantní a vyčerpávají
    (nebo reprezentují) všechny zájmové kategorie.
poissonova-regrese:
  def: GLM pro odezvu tvořenou počty (nezáporná celá čísla); předpokládá Poissonovo
    rozdělení odezvy a logaritmický link.
porovnani-modelu:
  def: Postup výběru nejlepšího modelu z množiny kandidátů pomocí kritérií jako AIC
    nebo likelihood ratio test.
post-hoc-test:
  def: Test prováděný po signifikantní ANOVA k identifikaci, které konkrétní páry
    skupin se od sebe liší; opravuje p-hodnoty pro mnohonásobné porovnávání.
prediktor:
  def: Proměnná, pomocí níž vysvětlujeme variabilitu odezvy; v notaci `y ~ x` je prediktor
    `x`.
prumer:
  def: Součet hodnot vydělený jejich počtem; nejběžnější míra polohy (střední hodnoty).
residuum:
  def: 'Rozdíl mezi pozorovanou hodnotou odezvy a hodnotou predikovanou modelem: eᵢ
    = yᵢ − ŷᵢ.'
rozdeleni:
  def: Matematický popis, jak jsou hodnoty proměnné rozloženy; klíčové parametry závisí
    na konkrétním rozdělení (průměr a rozptyl pro normální, λ pro Poissonovo).
rozptyl:
  def: Průměr čtverců odchylek od průměru; míra variability dat. Odmocnina rozptylu
    je směrodatná odchylka.
sklon:
  def: Parametr lineárního modelu udávající, o kolik se změní odezva, pokud prediktor
    vzroste o jednu jednotku (při zachování ostatních prediktorů).
smerodatna-odchylka:
  def: Odmocnina rozptylu; vyjadřuje průměrnou vzdálenost hodnot od průměru ve stejných
    jednotkách jako původní data.
standardni-chyba:
  def: Míra přesnosti odhadu parametru (typicky průměru) z dat; udává, jak moc by
    se odhadnutý parametr lišil při opakovaném vzorkování ze stejné populace.
stupne-volnosti:
  def: Počet nezávislých informací dostupných pro odhad parametru; počet pozorování
    minus počet odhadovaných parametrů.
t-test:
  def: Statistický test porovnávající průměry dvou skupin (nebo průměr s konstantou);
    ekvivalent lineárního modelu se dvěma úrovněmi faktoru.
transformace:
  def: Matematická operace použitá na hodnoty proměnné s cílem splnit předpoklady
    modelu nebo zlepšit linearitu vztahu.
variabilita:
  def: Obecný termín pro rozsah, v němž se hodnoty proměnné liší od sebe navzájem;
    kvantifikuje se pomocí rozptylu, SD, IQR nebo rozsahu.
cetnost:
  def: Počet výskytů určité hodnoty nebo kategorie v datové sadě; pro kategoriální
    proměnné je četnost základní deskriptivní statistikou.
zobecneny-linearni-model:
  def: Viz heslo GLM.
